<script>


const monthNames=[

"January",
"February",
"March",
"April",
"May",
"June",
"July",
"August",
"September",
"October",
"November",
"December"

];


const dayNames=[

"Mon",
"Tue",
"Wed",
"Thu",
"Fri",
"Sat",
"Sun"

];


// Start from current month

let today = new Date();

let month = today.getMonth();

let year = today.getFullYear();


// Calendar limits

const startMonth = month;

const startYear = year;

const endMonth = 11;

const endYear = 2027;



// Recurring and special dates

const yearlyDates = {


"birthday-you":{

month:2,
day:1,
icon:"🎂",
page:"birthday-you.html"

},


"anniversary":{

month:4,
day:12,
icon:"❤️",
page:"anniversary.html"

},


"birthday-him":{

month:12,
day:7,
icon:"🎁",
page:"birthday-him.html"

}


};



// One-time dates

const specialDates = {


"sixmonths":{

year:2026,
month:10,
day:12,
icon:"🍂",
page:"sixmonths.html"

}


};





function drawCalendar(){


const calendar=document.getElementById("calendar");


calendar.innerHTML="";


document.getElementById("title").innerHTML=

monthNames[month]+" "+year;




dayNames.forEach(name=>{


let d=document.createElement("div");

d.className="day-name";

d.innerHTML=name;

calendar.appendChild(d);


});




let first=new Date(year,month,1);


let start=(first.getDay()+6)%7;



for(let i=0;i<start;i++){


let empty=document.createElement("div");

empty.className="day empty";

calendar.appendChild(empty);


}





let totalDays=new Date(year,month+1,0).getDate();





for(let day=1;day<=totalDays;day++){


let box=document.createElement("div");


let event=null;



// Check yearly events

for(let item in yearlyDates){


let date=yearlyDates[item];


if(
date.month === month+1 &&
date.day === day
){

event=date;

}


}




// Check one-time events

for(let item in specialDates){


let date=specialDates[item];


if(
date.year === year &&
date.month === month+1 &&
date.day === day
){

event=date;

}


}




if(event){


box.className="day special";


box.innerHTML=

"<div class='icon'>"+
event.icon+
"</div><div>"+day+"</div>";



box.onclick=()=>{

window.location=event.page;

};


}

else{


box.className="day";

box.innerHTML=day;


}



calendar.appendChild(box);


}


}






function previousMonth(){


if(
year===startYear &&
month===startMonth
){

return;

}



month--;



if(month<0){


month=11;

year--;


}


drawCalendar();


}






function nextMonth(){


if(
year===endYear &&
month===endMonth
){

return;

}



month++;



if(month>11){


month=0;

year++;


}


drawCalendar();


}





drawCalendar();


</script>
