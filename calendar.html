<script>

const monthNames = [
"January",
"February",
"March",
"April",
"May",
"June",
"July",
"August",
"September",
"October",
"November",
"December"
];


const dayNames = [
"Mon",
"Tue",
"Wed",
"Thu",
"Fri",
"Sat",
"Sun"
];


// Current month start

let today = new Date();

let month = today.getMonth();

let year = today.getFullYear();


// Calendar limits

const startMonth = month;
const startYear = year;

const endMonth = 11;
const endYear = 2027;



// Events

const events = [

{
month:2,
day:1,
icon:"🎂",
page:"birthday-you.html",
repeat:true
},

{
month:4,
day:12,
icon:"❤️",
page:"anniversary.html",
repeat:true
},

{
month:10,
day:12,
icon:"🍂",
page:"sixmonths.html",
repeat:false,
year:2026
},

{
month:12,
day:7,
icon:"🎁",
page:"birthday-him.html",
repeat:true
}

];



function drawCalendar(){


const calendar = document.getElementById("calendar");

calendar.innerHTML = "";


document.getElementById("title").innerHTML =
monthNames[month] + " " + year;



dayNames.forEach(name => {

let d = document.createElement("div");

d.className = "day-name";

d.innerHTML = name;

calendar.appendChild(d);

});



let first = new Date(year, month, 1);

let start = (first.getDay()+6)%7;



for(let i=0; i<start; i++){

let empty = document.createElement("div");

empty.className="day empty";

calendar.appendChild(empty);

}



let totalDays = new Date(year, month+1, 0).getDate();



for(let day=1; day<=totalDays; day++){


let box = document.createElement("div");

let foundEvent = null;



events.forEach(event => {


if(
event.day === day &&
event.month === month+1 &&
(
event.repeat === true ||
event.year === year
)
){

foundEvent = event;

}


});



if(foundEvent){


box.className="day special";


box.innerHTML =
"<div class='icon'>"+
foundEvent.icon+
"</div><div>"+
day+
"</div>";



box.onclick=function(){

window.location = foundEvent.page;

};


}

else{


box.className="day";

box.innerHTML = day;


}


calendar.appendChild(box);


}


}





function previousMonth(){


if(
year === startYear &&
month === startMonth
){

return;

}


month--;


if(month < 0){

month = 11;

year--;

}


drawCalendar();

}





function nextMonth(){


if(
year === endYear &&
month === endMonth
){

return;

}


month++;


if(month > 11){

month = 0;

year++;

}


drawCalendar();

}




drawCalendar();


</script>
