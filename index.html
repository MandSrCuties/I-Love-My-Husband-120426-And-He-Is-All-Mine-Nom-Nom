<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Phone/iPhone display setting -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex, nofollow">

    <title>For You ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(#ffdce9, #fff7fb);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #444;
        }

        .phone-screen {
            width: 100%;
            max-width: 420px;
            min-height: 90vh;
            background: white;
            border-radius: 30px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .heart {
            font-size: 70px;
            animation: float 2s ease-in-out infinite;
        }

        h1 {
            color: #d63384;
            font-size: 36px;
            margin: 20px 0;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            background: #d63384;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 18px;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }

            100% {
                transform: translateY(0);
            }
        }

        /* Extra adjustment for smaller phones */
        @media (max-width: 380px) {
            h1 {
                font-size: 30px;
            }

            p {
                font-size: 16px;
            }

            .heart {
                font-size: 55px;
            }
        }
    </style>

</head>

<body>

    <div class="phone-screen">

        <div class="heart">❤️</div>

        <h1>Hi you</h1>

        <p>
            You found the secret page.
        </p>

        <p>
            This little website was made just for you.
        </p>

        <a class="button" href="#">
            Open ❤️
        </a>

    </div>

</body>

</html>
